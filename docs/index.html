<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>matrices.luau</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Core Theme + Dark Palette + Prism -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">

    <style>
      :root,
      [data-theme="dark"] {
        --base-background-color: #070709;
        --sidebar-background: #0a0a0e;
        --sidebar-border-color: #18181f;
        --base-color: #d4d4d8;
        --heading-color: #ffffff;
        --theme-color: #3b82f6;
        --accent-color: #3b82f6;
        --code-block-background: #0d0d12;
        --code-inline-background: #14141c;
        --code-inline-color: #93c5fd;
        --border-color: #18181f;
        --blockquote-background: #0c0c11;
        --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --code-font-family: 'JetBrains Mono', monospace;
      }

      html,
      body {
        background-color: #070709 !important;
        color: #d4d4d8;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Sidebar */
      .sidebar {
        background-color: #0a0a0e !important;
        border-right: 1px solid #18181f !important;
        padding: 24px 16px;
      }

      .sidebar .app-name-link {
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        color: #ffffff !important;
      }

      .sidebar-nav li > a {
        color: #8e8e9a !important;
        font-size: 0.9rem;
        border-radius: 6px;
        padding: 5px 10px;
        transition: all 0.15s ease;
      }

      .sidebar-nav li > a:hover {
        color: #ffffff !important;
        background: rgba(255, 255, 255, 0.04);
      }

      .sidebar-nav li.active > a {
        color: #60a5fa !important;
        background: rgba(59, 130, 246, 0.1);
        font-weight: 500;
      }

      /* Search bar */
      .search input {
        background-color: #101016 !important;
        border: 1px solid #1e1e28 !important;
        border-radius: 8px !important;
        color: #ffffff !important;
        padding: 8px 12px !important;
        font-size: 0.85rem;
      }

      .search input:focus {
        border-color: #3b82f6 !important;
        outline: none;
      }

      /* Main Content */
      .markdown-section {
        max-width: 820px;
        padding: 40px 48px 80px;
        line-height: 1.7;
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: #ffffff;
        letter-spacing: -0.025em;
        font-weight: 600;
      }

      .markdown-section h2 {
        border-bottom: 1px solid #18181f;
        padding-bottom: 0.45rem;
        margin-top: 2.5rem;
      }

      .markdown-section h3 {
        margin-top: 2rem;
        font-size: 1.25rem;
      }

      .markdown-section hr {
        border: none;
        border-top: 1px solid #16161d;
        margin: 2rem 0;
      }

      /* Inline Code & Code Blocks */
      .markdown-section code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        background-color: #14141c !important;
        color: #93c5fd !important;
        padding: 2px 6px;
        border-radius: 5px;
        border: 1px solid #1f1f2b;
      }

      .markdown-section pre {
        background-color: #0d0d12 !important;
        border: 1px solid #1a1a24 !important;
        border-radius: 10px !important;
        padding: 16px 20px !important;
        margin: 1rem 0 !important;
      }

      .markdown-section pre > code {
        background-color: transparent !important;
        border: none !important;
        padding: 0 !important;
        color: #e4e4e7 !important;
        font-size: 0.88rem;
        line-height: 1.6;
      }

      /* Blockquotes & Alerts */
      .markdown-section blockquote {
        background-color: #0c0c12 !important;
        border-left: 3px solid #3b82f6 !important;
        border-radius: 0 8px 8px 0;
        padding: 12px 18px;
        color: #a1a1aa;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #070709;
      }
      ::-webkit-scrollbar-thumb {
        background: #22222c;
        border-radius: 3px;
      }
    </style>
  </head>
  <body class="loading">
    <div id="app"></div>

    <!-- Configuration -->
    <script>
      window.$docsify = {
        name: 'matrices.luau',
        repo: 'chan4one/matrices-library',
        homepage: 'index.md',
        subMaxLevel: 3,
        auto2top: true,
        search: {
          placeholder: 'Search API...',
          noData: 'No results found.'
        }
      };
    </script>

    <!-- Docsify.js & Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
    <script>
      Prism.languages.luau = Prism.languages.extend('lua', {
        'keyword': /\b(?:and|break|continue|const|do|else|elseif|end|export|false|for|function|goto|if|in|local|nil|not|or|repeat|return|then|true|type|typeof|until|while)\b/,
        'builtin': /\b(?:buffer|vector|string|table|math|coroutine|task|debug|os|bit32|utf8|number|boolean|any|unknown|never|matrice)\b/,
        'string-interpolation': {
          pattern: /`(?:\\[\s\S]|\{(?:[^{}]|\{[^{}]*\})*\}|[^\\`{])*`/,
          greedy: true
        }
      });
    </script>
  </body>
</html>
